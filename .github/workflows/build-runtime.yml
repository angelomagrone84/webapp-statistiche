name: Build Statistics Core Runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype,curl,dom,fileinfo,filter,gd,hash,iconv,libxml,mbstring,openssl,pdo,pdo_mysql,session,simplexml,tokenizer,xml,xmlreader,xmlwriter,zip,zlib
          tools: composer:v2
          coverage: none

      - name: Build production vendor
        shell: bash
        run: |
          cat > composer.json <<'JSON'
          {
            "name": "aqvaworld/statistics-core-runtime",
            "type": "project",
            "require": {
              "php": "^8.5",
              "laravel/framework": "^13.0",
              "phpoffice/phpspreadsheet": "5.10.0"
            },
            "autoload": {
              "psr-4": {
                "App\\": "core/app/"
              }
            },
            "config": {
              "optimize-autoloader": true,
              "preferred-install": "dist",
              "sort-packages": true,
              "platform": {"php": "8.5.12"}
            },
            "minimum-stability": "stable",
            "prefer-stable": true
          }
          JSON
          mkdir -p core/app
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts
          test -f vendor/autoload.php
          test -d vendor/laravel/framework
          test -d vendor/phpoffice/phpspreadsheet
          php -r "require 'vendor/autoload.php'; echo Illuminate\\Foundation\\Application::VERSION, PHP_EOL; echo PhpOffice\\PhpSpreadsheet\\Spreadsheet::class, PHP_EOL;"

      - name: Download Bootstrap 5.3.8
        shell: bash
        run: |
          mkdir -p bootstrap
          curl -fsSL https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css -o bootstrap/bootstrap.min.css
          curl -fsSL https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js -o bootstrap/bootstrap.bundle.min.js
          grep -q 'Bootstrap  v5.3.8' bootstrap/bootstrap.min.css
          grep -q 'Bootstrap v5.3.8' bootstrap/bootstrap.bundle.min.js

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: statistics-core-0.5.0-runtime
          path: |
            vendor/
            composer.json
            composer.lock
            bootstrap/
          if-no-files-found: error
          retention-days: 2
